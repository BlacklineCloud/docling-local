name: Bug report
description: Report a reproducible problem in this deployment wrapper
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not upload confidential documents, API keys, or private logs.
  - type: input
    id: host
    attributes:
      label: Host environment
      description: Operating system, CPU architecture, Docker and Compose versions
    validations:
      required: true
  - type: input
    id: image
    attributes:
      label: Docling Serve image
      description: Repository and exact image tag
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use non-sensitive sample data
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
